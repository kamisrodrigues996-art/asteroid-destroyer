<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Asteroid Destroyer RGB</title>

<style>
* { box-sizing: border-box; }

:root {
    --cyan: #00f5ff;
    --pink: #ff35d3;
    --purple: #9b4dff;
    --bg: #050611;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    background:
        radial-gradient(ellipse at 20% 20%, #251044 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #082a42 0%, transparent 45%),
        var(--bg);
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

h1 {
    font-size: clamp(26px, 5vw, 48px);
    letter-spacing: 3px;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan), 0 0 25px var(--purple);
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 8px var(--cyan), 0 0 18px var(--purple); }
    to { text-shadow: 0 0 15px var(--pink), 0 0 35px var(--cyan); }
}

.panel {
    padding: 25px;
    border: 1px solid #5a3c94;
    border-radius: 18px;
    background: rgba(12, 13, 35, .92);
    box-shadow: 0 0 20px #782bff55, inset 0 0 20px #162b5a55;
}

h2 { color: var(--pink); }

select, button {
    border: 1px solid var(--cyan);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 7px;
    font-size: 15px;
}

select {
    background: #11172d;
    color: white;
    width: min(100%, 280px);
}

button {
    background: linear-gradient(110deg, #087ee9, #8b35d9);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 12px #347fff77;
    transition: .2s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px var(--cyan);
}

#game { display: none; }

.hud {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
}

.hud span {
    padding: 10px 16px;
    border: 1px solid #643ed2;
    border-radius: 10px;
    background: #11142c;
    box-shadow: 0 0 10px #733dff66;
}

canvas {
    display: block;
    width: 100%;
    max-width: 800px;
    height: auto;
    margin: auto;
    background: #030510;
    border: 2px solid var(--cyan);
    border-radius: 12px;
    box-shadow: 0 0 12px var(--cyan), 0 0 28px #8b35d966;
    touch-action: none;
}

.controls-info {
    color: #b8c6ff;
    font-size: 13px;
    margin: 12px;
}

.mobile-controls {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin: 14px auto;
    touch-action: none;
}

.mobile-controls button {
    width: 76px;
    height: 65px;
    font-size: 25px;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.mobile-controls .fire {
    width: 110px;
    background: linear-gradient(110deg, #e51b9c, #8528e8);
    border-color: var(--pink);
    box-shadow: 0 0 16px #ff35d388;
    font-size: 16px;
}

#message {
    color: #ffe66d;
    min-height: 24px;
}

@media (pointer: coarse), (max-width: 700px) {
    .mobile-controls { display: flex; }
    body { padding: 8px; }
    .panel { padding: 15px; }
    .controls-info { display: none; }
}

@media (max-height: 500px) and (orientation: landscape) {
    body { padding: 4px; }
    h1 { font-size: 22px; margin: 3px; }
    .hud { margin: 4px; }
    .hud span { padding: 5px 9px; }
    .mobile-controls { margin: 5px; }
    .mobile-controls button { height: 48px; }
}
</style>
</head>

<body>
<div class="container">

<h1>🚀 ASTEROID DESTROYER</h1>

<div id="menu" class="panel">
    <h2>CONFIGURE SUA MISSÃO</h2>

    <p>Escolha a dificuldade:</p>
    <select id="difficulty">
        <option value="easy">Fácil</option>
        <option value="medium" selected>Médio</option>
        <option value="hard">Difícil</option>
        <option value="extreme">Extremo</option>
    </select>

    <p>Escolha sua nave:</p>
    <select id="shipChoice">
        <option value="agile">⚡ Nave Ágil</option>
        <option value="combat">🔥 Nave de Combate</option>
        <option value="armor">🛡️ Nave Blindada</option>
        <option value="special">💜 Nave Especial</option>
    </select>

    <p id="shipDescription">Rápida e fácil de controlar.</p>

    <p>🏆 Recorde: <strong id="bestScore">0</strong></p>

    <button onclick="startGame()">INICIAR MISSÃO</button>
</div>

<div id="game">
    <div class="hud">
        <span>⭐ Pontos: <b id="score">0</b></span>
        <span>❤️ Vidas: <b id="lives">3</b></span>
        <span>⚡ Nível: <b id="levelName">Médio</b></span>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="mobile-controls">
        <button id="leftBtn">⬅</button>
        <button class="fire" id="fireBtn">🔥 ATIRAR</button>
        <button id="rightBtn">➡</button>
    </div>

    <p class="controls-info">
        COMPUTADOR: ← → ou A/D para mover | ESPAÇO para atirar
    </p>

    <p id="message"></p>
    <button onclick="backToMenu()">VOLTAR AO MENU</button>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const difficulties = {
    easy: { name: "Fácil", speed: 1.2, spawn: 1100, max: 5 },
    medium: { name: "Médio", speed: 2, spawn: 800, max: 8 },
    hard: { name: "Difícil", speed: 3, spawn: 550, max: 12 },
    extreme: { name: "Extremo", speed: 4.2, spawn: 350, max: 16 }
};

const ships = {
    agile: {
        description: "⚡ Muito rápida. Ideal para escapar.",
        speed: 7, lives: 3, weapon: "normal", color: "#00f5ff"
    },
    combat: {
        description: "🔥 Dispara lasers mais rapidamente.",
        speed: 5, lives: 3, weapon: "fast", color: "#ff5555"
    },
    armor: {
        description: "🛡️ Começa com 5 vidas, mas é mais lenta.",
        speed: 4, lives: 5, weapon: "normal", color: "#72ff8b"
    },
    special: {
        description: "💜 Dispara três lasers de uma vez.",
        speed: 5, lives: 3, weapon: "triple", color: "#c58aff"
    }
};

let player;
let asteroids = [];
let lasers = [];
let stars = [];
let score = 0;
let lives = 3;
let running = false;
let animationId = null;
let selectedDifficulty;
let selectedShip;
let lastShot = 0;
let lastAsteroid = 0;

const keys = {};
const touch = { left: false, right: false, fire: false };

let bestScore = Number(localStorage.getItem("asteroidRecord")) || 0;
document.getElementById("bestScore").textContent = bestScore;

document.getElementById("shipChoice").addEventListener("change", function() {
    document.getElementById("shipDescription").textContent =
        ships[this.value].description;
});

// Controles do teclado
document.addEventListener("keydown", function(event) {
    keys[event.key.toLowerCase()] = true;
    if (event.code === "Space") event.preventDefault();
    if (event.key === "Escape" && running) backToMenu();
});

document.addEventListener("keyup", function(event) {
    keys[event.key.toLowerCase()] = false;
});

// Controles de toque do celular
function setupTouchButton(id, action) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        touch[action] = true;
        button.setPointerCapture(event.pointerId);
    });

    function release() {
        touch[action] = false;
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
    button.addEventListener("pointerleave", release);
}

setupTouchButton("leftBtn", "left");
setupTouchButton("rightBtn", "right");
setupTouchButton("fireBtn", "fire");

function updateInfo() {
    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
}

function startGame() {
    selectedDifficulty =
        difficulties[document.getElementById("difficulty").value];

    selectedShip =
        ships[document.getElementById("shipChoice").value];

    score = 0;
    lives = selectedShip.lives;
    asteroids = [];
    lasers = [];

    player = {
        x: canvas.width / 2,
        y: canvas.height - 65,
        speed: selectedShip.speed,
        color: selectedShip.color
    };

    stars = [];

    for (let i = 0; i < 90; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.3,
            speed: Math.random() * 1.2 + 0.3
        });
    }

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("levelName").textContent =
        selectedDifficulty.name;
    document.getElementById("message").textContent = "";

    updateInfo();
    touch.left = touch.right = touch.fire = false;

    running = true;
    lastShot = 0;
    lastAsteroid = 0;

    cancelAnimationFrame(animationId);
    gameLoop();
}

function drawStars() {
    stars.forEach(star => {
        ctx.fillStyle = "#ffffff";
        ctx.globalAlpha = 0.3 + Math.random() * 0.7;
        ctx.fillRect(star.x, star.y, star.size, star.size);
        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }
    });

    ctx.globalAlpha = 1;
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    ctx.shadowColor = player.color;
    ctx.shadowBlur = 25;
    ctx.fillStyle = player.color;

    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.lineTo(22, 22);
    ctx.lineTo(0, 12);
    ctx.lineTo(-22, 22);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 15;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    // Fogo dos motores
    ctx.fillStyle = "#ff8c32";
    ctx.shadowColor = "#ff35d3";
    ctx.beginPath();
    ctx.moveTo(-7, 17);
    ctx.lineTo(0, 34 + Math.random() * 9);
    ctx.lineTo(7, 17);
    ctx.fill();

    ctx.restore();
}

function createAsteroid() {
    const radius = 15 + Math.random() * 22;
    const points = [];

    for (let i = 0; i < 9; i++) {
        points.push(0.75 + Math.random() * 0.25);
    }

    asteroids.push({
        x: radius + Math.random() * (canvas.width - radius * 2),
        y: -radius,
        radius,
        speed: selectedDifficulty.speed + Math.random() * 1.5,
        rotation: Math.random() * 6,
        points
    });
}

function drawAsteroids() {
    asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotation);

        ctx.fillStyle = "#9299a8";
        ctx.strokeStyle = "#ff48d9";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#a43cff";
        ctx.shadowBlur = 12;

        ctx.beginPath();

        for (let i = 0; i < a.points.length; i++) {
            const angle = i * Math.PI * 2 / a.points.length;
            const size = a.radius * a.points[i];
            const x = Math.cos(angle) * size;
            const y = Math.sin(angle) * size;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }

        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    });
}

function shoot() {
    const firing = keys[" "] || keys["space"] || touch.fire;
    if (!firing) return;

    const delay = selectedShip.weapon === "fast" ? 160 : 350;
    const now = Date.now();

    if (now - lastShot < delay) return;
    lastShot = now;

    if (selectedShip.weapon === "triple") {
        lasers.push(
            { x: player.x, y: player.y - 25 },
            { x: player.x - 13, y: player.y - 15 },
            { x: player.x + 13, y: player.y - 15 }
        );
    } else {
        lasers.push({ x: player.x, y: player.y - 25 });
    }
}

function drawLasers() {
    ctx.fillStyle = "#00f5ff";
    ctx.shadowColor = "#00f5ff";
    ctx.shadowBlur = 18;

    lasers.forEach(laser => {
        ctx.fillRect(laser.x - 3, laser.y, 6, 18);
        laser.y -= 9;
    });

    ctx.shadowBlur = 0;
    lasers = lasers.filter(laser => laser.y > -20);
}

function checkCollisions() {
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        let destroyed = false;

        for (let j = lasers.length - 1; j >= 0; j--) {
            const l = lasers[j];
            const dx = a.x - l.x;
            const dy = a.y - l.y;

            if (Math.sqrt(dx * dx + dy * dy) < a.radius) {
                asteroids.splice(i, 1);
                lasers.splice(j, 1);
                score += 10;
                updateInfo();
                destroyed = true;
                break;
            }
        }

        if (destroyed) continue;
    }

    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        const dx = a.x - player.x;
        const dy = a.y - player.y;

        if (Math.sqrt(dx * dx + dy * dy) < a.radius + 18) {
            asteroids.splice(i, 1);
            lives--;
            updateInfo();

            if (lives <= 0) {
                gameOver();
                return;
            }
        }
    }
}

function update() {
    if (keys["arrowleft"] || keys["a"] || touch.left) {
        player.x -= player.speed;
    }

    if (keys["arrowright"] || keys["d"] || touch.right) {
        player.x += player.speed;
    }

    player.x = Math.max(25, Math.min(canvas.width - 25, player.x));

    shoot();

    const now = Date.now();

    if (
        now - lastAsteroid > selectedDifficulty.spawn &&
        asteroids.length < selectedDifficulty.max
    ) {
        createAsteroid();
        lastAsteroid = now;
    }

    asteroids.forEach(a => {
        a.y += a.speed;
        a.rotation += 0.01;
    });

    // Se passar pela nave, o asteroide não tira vida.
    asteroids = asteroids.filter(
        a => a.y < canvas.height + a.radius
    );

    checkCollisions();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();
    drawPlayer();
    drawAsteroids();
    drawLasers();
}

function gameLoop() {
    if (!running) return;

    update();
    if (!running) return;

    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    running = false;
    cancelAnimationFrame(animationId);

    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("asteroidRecord", bestScore);
        document.getElementById("bestScore").textContent = bestScore;
    }

    document.getElementById("message").textContent =
        "FIM DE JOGO! Pontuação: " + score;

    ctx.fillStyle = "rgba(3, 5, 16, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = "center";
    ctx.shadowColor = "#ff35d3";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 46px Arial";
    ctx.fillText("FIM DE JOGO!", canvas.width / 2, 260);

    ctx.shadowBlur = 0;
    ctx.font = "25px Arial";
    ctx.fillText("Pontos: " + score, canvas.width / 2, 315);
}

function backToMenu() {
    running = false;
    cancelAnimationFrame(animationId);

    touch.left = touch.right = touch.fire = false;

    document.getElementById("game").style.display = "none";
    document.getElementById("menu").style.display = "block";
    document.getElementById("bestScore").textContent = bestScore;
}
</script>
</body>
</html>
